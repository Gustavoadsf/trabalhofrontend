<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css.css">
  <link href="https://googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <title>Card de Resumo do Pedido</title>
</head>
<header class="toposite">
</header>
<body>
<div class="centro">
  <img id="topo" src="images\illustration-hero.svg" alt="topo">
  <p>Order Summary</p>
  <p>You can now listen to millions of songs, audiobooks, and podcasts on any 
  device anywhere you like!</p>
  <div class="meio">
    <img id="musica" src="images\icon-music.svg" alt="musica">
    <p>Annual Plan<br><span class="preco">$59.99/year</p>
    <button class="change">Change</button>
  </div>
  <button class="assinar">Proceed to Payment</button>
  <button class="cancelar">Cancel Order</button>
</div>
</body>
</html>
